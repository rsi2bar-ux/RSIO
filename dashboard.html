<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sniper Data Backend</title><style>
body{margin:0;background:#0a0f1c;color:#e8eefc;font-family:system-ui,sans-serif;padding:16px}.card{background:#101a2e;border-radius:24px;padding:22px;max-width:640px;margin:0 auto}h1{font-size:30px;margin:0 0 10px}.on{color:#2ee27a;font-size:20px;margin:6px 0}.off{color:#ff5a6e}.badge{background:#0b1324;border-radius:8px;padding:3px 9px;font-family:monospace}.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #ffffff12;font-size:15px}.dot{width:11px;height:11px;border-radius:50%;margin-top:5px;flex:none}.g{background:#2ee27a}.r{background:#ff5a6e}.a{background:#f5c451}.d{color:#9baac2;font-size:13px}a{color:#4fc3ff}button{background:#2ee27a;border:0;border-radius:12px;padding:10px 14px;font-weight:700;margin:10px 8px 0 0}.links{margin-top:14px;line-height:2}</style></head><body><div class="card"><h1>Sniper Data Backend</h1><div id="st" class="on">● CHECKING…</div><div>Version: <span class="badge" id="ver">-</span> · <span id="mk">-</span> · <span class="d" id="up">-</span></div><div id="ck" style="margin-top:14px"></div><button onclick="tp()">Send test push</button><span id="tr" class="d"></span><h3>Recent signals</h3><div id="sg" class="d">none yet</div><div class="links"><a href="/health">Health</a> · <a href="/api/health">API Health JSON</a> · <a href="/state">State</a> · <a href="/analytics?index=NIFTY">Analytics</a> · <a href="/oi-chain?index=NIFTY">OI chain</a> · <a href="/gann-candles?index=NIFTY&tf=1m">Candles</a> · <a href="/spot">Spot</a> · <a href="/signals">Signals</a></div></div><script>
function tp(){fetch('/push/test',{method:'POST'}).then(r=>r.json()).then(j=>document.getElementById('tr').textContent=j.success?' sent '+j.sent+'/'+j.of:' '+(j.error||'failed')).catch(function(){document.getElementById('tr').textContent=' failed'})}
function load(){fetch('/health').then(function(r){return r.json()}).then(function(h){var s=document.getElementById('st');s.className=h.ok?'on':'on off';s.textContent=h.ok?'● ALL OK':'● CHECK BELOW';document.getElementById('ver').textContent=h.version;document.getElementById('mk').textContent=h.market?'Market OPEN':'Market CLOSED';document.getElementById('up').textContent='updated '+new Date().toLocaleTimeString();document.getElementById('ck').innerHTML=h.checks.map(function(c){return '<div class="row"><span class="dot '+(c.ok?'g':c.warn?'a':'r')+'"></span><div><b>'+c.name+'</b><div class="d">'+c.d+'</div></div></div>'}).join('');document.getElementById('sg').innerHTML=h.signals.length?h.signals.map(function(e){return new Date(e.time).toLocaleTimeString()+' · '+e.index+' '+e.tf+' · <b style="color:'+(e.side=='CALL'?'#2ee27a':'#ff5a6e')+'">'+e.side+'</b> '+e.type}).join('<br>'):'none yet'}).catch(function(){var s=document.getElementById('st');s.className='on off';s.textContent='● OFFLINE / waking up'})}
load();setInterval(load,3000)</script></body></html>
